services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: trafficverdict
      POSTGRES_USER: trafficverdict
      POSTGRES_PASSWORD: trafficverdict_dev
    ports:
      - "55432:5432"
    volumes:
      - trafficverdict_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trafficverdict -d trafficverdict"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  trafficverdict_postgres:
