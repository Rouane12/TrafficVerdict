services:
  - type: web
    name: trafficverdict
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: AUTH_SECRET
        generateValue: true
      - key: CREDENTIAL_ENCRYPTION_SECRET
        generateValue: true
      - key: SYNC_TRIGGER_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://trafficverdict.app
      - key: DATABASE_URL
        sync: false